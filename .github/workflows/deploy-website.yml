name: Deploy website to GitHub Pages

# Builds and deploys the static marketing site (chakusarecovery.com) to
# GitHub Pages. Only runs on changes under website/, completely separate
# from the backend (/src) and mobile app (/mobile). No API tokens needed:
# GitHub Pages deploys are authorized via the built-in GITHUB_TOKEN and
# this repo's own Pages permissions, not an external credential.
#
# One-time manual step required before this can succeed: in this repo's
# Settings -> Pages -> "Build and deployment" -> Source, select
# "GitHub Actions" (not a branch).
on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      # npm ci has occasionally hung indefinitely on the hosted runner
      # (npm registry or restored-cache flakiness, not a repo issue -
      # the lockfile is small and has no git/http dependencies). Bound
      # each attempt with `timeout` and retry a few times with a clean
      # npm cache instead of letting one bad attempt stall the whole
      # job for hours.
      - working-directory: website
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if timeout 180 npm ci --no-audit --no-fund; then
              exit 0
            fi
            echo "npm ci attempt $attempt failed or timed out, cleaning cache and retrying"
            npm cache clean --force
            sleep 5
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - working-directory: website
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
