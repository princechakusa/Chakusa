name: Deploy website to GitHub Pages

# Builds and deploys the static marketing site (chakusarecovery.com) to
# GitHub Pages. Only runs on changes under website/, completely separate
# from the backend (/src) and mobile app (/mobile). No API tokens needed:
# GitHub Pages deploys are authorized via the built-in GITHUB_TOKEN and
# this repo's own Pages permissions, not an external credential.
#
# One-time manual step required before this can succeed: in this repo's
# Settings -> Pages -> "Build and deployment" -> Source, select
# "GitHub Actions" (not a branch).
on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - working-directory: website
        run: npm ci

      - working-directory: website
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
