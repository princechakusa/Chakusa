services:
  postgres:
    image: postgres:16-alpine
    container_name: chakusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chakusa
    ports:
      - "5432:5432"
    volumes:
      - chakusa-postgres-data:/var/lib/postgresql/data

volumes:
  chakusa-postgres-data:
